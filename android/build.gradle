// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    // NDK 27 toolchain (proven to build on EAS). The QVAC engines need a
    // NEWER libc++_shared.so at runtime (LLVM 18+ exception symbols) — that
    // is shipped explicitly via app/src/main/jniLibs/arm64-v8a/, which wins
    // the packaging merge over every library-provided copy. Do NOT remove
    // that file: without it the engine dlopen fails = crash at model load.
    ndkVersion = "27.1.12297006"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
